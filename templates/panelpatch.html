<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PanelPatch · 面板试图台</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='panelpatch.css') }}">
  <script defer src="{{ url_for('static', filename='panelpatch.js') }}"></script>
</head>
<body>
<header class="masthead">
  <a class="brand" href="/"><i aria-hidden="true"></i> PanelPatch</a>
  <span class="mast-label">面板试图台</span>
  <a class="external" href="/prepare">照片准备 ↗</a>
</header>
<main>
  <section class="introduction">
    <div><h1>灰阶试图均匀性复查</h1><p>从显示面板的灰阶试图原照，检查区域亮度和相对选定参考点的差。</p></div>
    <div class="top-actions">
      <button id="practice" class="primary" type="button">打开练习面板</button>
      <button id="open-import" type="button">导入原片</button>
    </div>
  </section>
  <p id="notice" class="notice" role="status" hidden></p>
  <section class="library">
    <label for="library">试图卡</label>
    <select id="library"><option value="">选取已存卡片</option></select>
    <span id="origin"></span>
  </section>
  <section id="empty" class="empty">
    <div class="display-icon" aria-hidden="true"><i></i></div>
    <h2>选择一张面板试图</h2>
    <p>将测量框放在屏幕有效画面内，从灰阶试图选择参考像素和截线。</p>
  </section>
  <section id="workspace" class="workspace" hidden>
    <div class="left">
      <section class="panel source">
        <div class="panel-head">
          <div><h2 id="card-title">原片</h2><span id="dimensions"></span></div>
          <div class="modes" role="group" aria-label="原照取样">
            <button id="probe-mode" data-mode="probe" aria-pressed="true" type="button">点读</button>
            <button id="mark-mode" data-mode="mark" aria-pressed="false" type="button">取截线</button>
            <button id="reference-mode" data-mode="reference" aria-pressed="false" type="button">取参考点</button>
          </div>
        </div>
        <div class="camera"><canvas id="capture" aria-label="面板试图，可点击取样或输入原片像素坐标"></canvas></div>
        <div class="probe">
          <b>原片点读</b>
          <form id="probe-form"><label>X <input id="probe-x" type="number" min="0" step="1" required></label>
            <label>Y <input id="probe-y" type="number" min="0" step="1" required></label>
            <button type="submit">读取</button></form>
          <span id="probe-result">选择原片像素</span>
        </div>
      </section>
      <section class="panel profile">
        <div class="panel-head">
          <div><h2 id="chart-title">原列相对亮度</h2><span id="chart-caption">当前截线 · 原片 Y</span></div>
          <div class="modes" role="group" aria-label="当前图表">
            <button data-chart="profile" aria-pressed="true" type="button">原列剖面</button>
            <button data-chart="coverage" aria-pressed="false" type="button">沿面板分布</button>
          </div>
        </div>
        <canvas id="chart" width="850" height="166" aria-label="原列亮度及试图分布"></canvas>
      </section>
    </div>
    <aside class="right">
      <section class="panel readout">
        <div class="panel-head"><h2>当前列平均偏差</h2><span id="measurement-state"></span></div>
        <div class="delta"><strong id="delta-value">—</strong><span id="delta-unit"></span></div>
        <p id="selected-level"></p>
      </section>
      <form id="calibration" class="panel settings">
        <div class="panel-head"><div><h2>测量框和参考</h2><span>坐标使用原片像素，X 向右，Y 向下</span></div></div>
        <label class="wide">卡片名称<input id="name" maxlength="80" required></label>
        <fieldset><legend>原片测量框 · px</legend><div class="form-grid">
          <label>左界 X<input data-setting="left" type="number" step="1" min="0" required></label>
          <label>右界 X<input data-setting="right" type="number" step="1" min="0" required></label>
          <label>截线 X<input data-setting="focus" type="number" step="1" min="0" required></label>
          <label>上界 Y<input data-setting="top" type="number" step="1" min="0" required></label>
          <label>下界 Y<input data-setting="bottom" type="number" step="1" min="0" required></label>
        </div></fieldset>
        <fieldset><legend>参考点与偏差</legend><div class="form-grid">
          <label>参考点 X<input data-setting="ref_x" type="number" step="1" min="0" required></label>
          <label>参考点 Y<input data-setting="ref_y" type="number" step="1" min="0" required></label>
          <label>偏差限值<input data-setting="limit" type="number" step="any" min="0.1" max="255" required></label>
        </div><p id="reference-info"></p></fieldset>
        <button id="save" class="primary" type="submit">保存并测量</button>
      </form>
      <section class="panel outputs">
        <div class="panel-head"><h2>试图交接</h2></div>
        <div><a id="proof" download>PNG 校样 ↓</a><a id="csv" download>CSV 读数 ↓</a><a id="zip" download>ZIP 试图卡 ↓</a></div>
        <button id="prepare" type="button">将原片送入照片准备 ↗</button>
      </section>
    </aside>
  </section>
</main>
<dialog id="import">
  <form id="upload">
    <h2>导入面板试图</h2>
    <label>试图卡名称<input name="name" maxlength="80" required></label>
    <label>照片<input name="photo" type="file" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" required></label>
    <p id="import-notice" role="status"></p>
    <div class="top-actions"><button id="cancel-import" type="button">取消</button><button class="primary" type="submit">建立试图卡</button></div>
  </form>
</dialog>
</body>
</html>
